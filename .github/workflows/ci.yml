name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      - run: pytest tests/test_security_smoke.py -q
      - run: python evals/run_eval.py evals/golden.jsonl
      - run: python check_proposal.py
      - run: python check_integration_map.py
      - run: python check_doc_links.py
      - run: python check_review_doc.py
      - run: python -m services.triage.rag_smoke
